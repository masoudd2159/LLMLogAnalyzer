# ============================================================
# Application Configuration
# ============================================================
spring.application.name=LLMLogAnalyzer
server.port=8081
# ============================================================
# MongoDB Configuration
# ============================================================
spring.data.mongodb.host=127.0.0.1
spring.data.mongodb.port=27017
spring.data.mongodb.database=LLMLogAnalyzer
spring.data.mongodb.auto-index-creation=true
# ============================================================
# OpenAI / GPT Configuration
# ============================================================
openai.api.key={OPENAI_API_KEY}
model.api.gpt.model-name=GPT-5 nano
model.api.gpt.url=https://api.openai.com/v1/chat/completions
# ============================================================
# Ollama Configuration
# ============================================================
model.api.ollama.url=http://localhost:11434/api/chat
model.api.ollama.model-name=qwen2.5:7b-instruct
# Record the digest reported by `ollama show qwen2.5:7b-instruct` before final runs.
model.api.ollama.model-digest=845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
model.api.ollama.options.temperature=0
model.api.ollama.options.top-p=0.1
model.api.ollama.options.repeat-penalty=1.0
model.api.ollama.options.seed=42
model.api.ollama.options.num-ctx=4096
model.api.ollama.options.num-predict=8
# ============================================================
# BGL Classification Configuration
# ============================================================
# Template cache:
#
# true:
#   Reuse the first validated prediction for repeated templates.
#
# false:
#   Call the classifier independently for every log record.
bgl.classification.template-cache.enabled=true
# Classification mode:
#
# true:
#   Hybrid experiment
#   Deterministic BglTemplateGuard + original LLM prompt
#
# false:
#   Prompt-only experiment
#   No deterministic BglTemplateGuard
#   Guard rules are included inside the selected LLM prompt
#
bgl.classification.template-guard.enabled=true
# In hybrid mode, only validated LLM predictions enter the cache.
#
# In prompt-only mode, a syntactically valid 0/1 LLM result is approved
# without consulting BglTemplateGuard.
bgl.classification.cache-only-validated-llm-results=true
# Safer cache key:
# category + component + severity + normalized message
bgl.classification.template-key.include-metadata=true
# Store line-level results in batches to avoid millions of individual MongoDB round trips.
bgl.persistence.batch-size=1000
# Exclude the labeled development/pilot subset from the final evaluation.
bgl.evaluation.exclusion.enabled=true
bgl.evaluation.exclusion.location=D:/Programming/Thesis/Dataset/BGL/BGL_2k.log
# ============================================================
# Chart Configuration
# ============================================================
# latest-run prevents records from separate executions from being mixed.
charts.data.scope=latest-run
# Optional explicit run UUID. When set, it takes precedence over charts.data.scope.
charts.run-id=
charts.fail-on-empty=true
charts.output-dir=.
# ============================================================
# Dataset Locations
# ============================================================
# Full source dataset; the 2k development subset above is removed at runtime.
bgl.location=D:/Programming/Thesis/Dataset/BGL/BGL.log
# AUTO records `git rev-parse HEAD` and whether the working tree was dirty.
experiment.git-commit=AUTO
hdfs.location=D:/Programming/Thesis/Dataset/HDFS_v1/HDFS.log
# ============================================================
# Spring Profiles
# ============================================================
# Generate charts only:
# mvn spring-boot:run -Dspring-boot.run.profiles=charts
# spring.profiles.active=charts

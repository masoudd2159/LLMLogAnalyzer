# ============================================================
# LLMLogAnalyzer - reproducible Qwen3.5:35B experiment defaults
# Environment variables override host-specific values.
# ============================================================
spring.application.name=LLMLogAnalyzer
server.port=${SERVER_PORT:8081}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/LLMLogAnalyzer}
spring.data.mongodb.auto-index-creation=true

# Ollama / Qwen3.5:35B (centralized in OllamaProperties)
model.api.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
model.api.ollama.chat-path=/api/chat
model.api.ollama.model-name=${MODEL_NAME:qwen3.5:35b}
# AUTO resolves and stores the local Ollama manifest digest from /api/tags.
model.api.ollama.model-version=${MODEL_VERSION:AUTO}
model.api.ollama.format=${FORMAT:json}
model.api.ollama.thinking=${THINKING:false}
model.api.ollama.keep-alive=${KEEP_ALIVE:30m}
model.api.ollama.options.temperature=${TEMPERATURE:0}
model.api.ollama.options.top-p=${TOP_P:0.9}
model.api.ollama.options.repeat-penalty=${REPEAT_PENALTY:1.0}
model.api.ollama.options.seed=${SEED:42}
model.api.ollama.options.num-ctx=${NUM_CTX:8192}
model.api.ollama.options.num-predict=${NUM_PREDICT:160}
model.api.ollama.timeouts.connect=${OLLAMA_CONNECT_TIMEOUT:10s}
model.api.ollama.timeouts.response=${OLLAMA_RESPONSE_TIMEOUT:15m}
model.api.ollama.retry.max-attempts=${OLLAMA_MAX_ATTEMPTS:3}
model.api.ollama.retry.initial-backoff=${OLLAMA_RETRY_INITIAL_BACKOFF:2s}
model.api.ollama.retry.max-backoff=${OLLAMA_RETRY_MAX_BACKOFF:15s}

# BGL classification
bgl.classification.template-cache.enabled=${BGL_TEMPLATE_CACHE:true}
bgl.classification.template-guard.enabled=${BGL_TEMPLATE_GUARD:true}
bgl.classification.cache-only-validated-llm-results=true
bgl.classification.template-key.include-metadata=true
bgl.persistence.batch-size=${BGL_BATCH_SIZE:1000}

# Dataset and experiment identity
bgl.location=${BGL_DATASET_PATH:data/BGL/BGL.log}
experiment.git-commit=${GIT_COMMIT:UNRECORDED}

# Charts/evaluation
charts.data.scope=${CHART_SCOPE:latest-run}
charts.run-id=${RUN_ID:}
charts.fail-on-empty=true
charts.output-dir=${CHART_OUTPUT_DIR:results}

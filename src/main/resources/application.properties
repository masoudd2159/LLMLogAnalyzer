# ============================================================
# Application Configuration
# ============================================================
spring.application.name=LLMLogAnalyzer
server.port=8081
# ============================================================
# MongoDB Configuration
# ============================================================
spring.data.mongodb.host=127.0.0.1
spring.data.mongodb.port=27017
spring.data.mongodb.database=LLMLogAnalyzer
# ============================================================
# OpenAI / GPT Configuration
# ============================================================
openai.api.key={OPENAI_API_KEY}
model.api.gpt.model-name=GPT-5 nano
model.api.gpt.url=https://api.openai.com/v1/chat/completions
# ============================================================
# Ollama Configuration
# ============================================================
model.api.ollama.url=http://localhost:11434/api/chat
model.api.ollama.model-name=qwen2.5:7b-instruct
# Faster deterministic local inference for short template inputs.
model.api.ollama.options.num-ctx=2048
model.api.ollama.options.num-predict=16
model.api.ollama.options.top-k=10
# ============================================================
# BGL Hybrid Template Cache Configuration
# ============================================================
bgl.classification.template-cache.enabled=true
bgl.classification.template-guard.enabled=true
bgl.classification.cache-only-validated-llm-results=true
# false = cache by normalized message template only. This reduces LLM calls heavily on full BGL.
# true  = cache by category/component/severity/message. This is safer but creates more unique templates.
bgl.classification.template-key.include-metadata=false
# ============================================================
# Dataset Locations
# ============================================================
bgl.location=D:/Programming/Thesis/Dataset/BGL/BGL.log
hdfs.location=D:/Programming/Thesis/Dataset/HDFS_v1/HDFS.log
# ============================================================
# Spring Profiles
# ============================================================
# For chart-only run:
# mvn spring-boot:run -Dspring-boot.run.profiles=charts
spring.profiles.active=charts
